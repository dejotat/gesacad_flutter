# =============================================================================
# GESACAD · Ejecutar con las imágenes PUBLICADAS en Docker Hub (sin el código fuente)
# =============================================================================
# Lo normal es usar iniciar.ps1 (esta misma carpeta): crea el .env con contraseñas aleatorias y arranca.
# A mano:
#   1) Crea un archivo .env aquí con:  DB_USER, DB_PASS, MYSQL_ROOT_PASSWORD, JWT_SECRET (mínimo 16
#      caracteres), ADMIN_BOOTSTRAP_USER y ADMIN_BOOTSTRAP_PASSWORD (8-64, con mayúscula, minúscula,
#      número y símbolo). Opcional: DOCKERHUB_USUARIO (por defecto dejota0712) y GESACAD_VERSION.
#   2) docker compose up -d --wait
#   3) Abre http://localhost:5000  (la API, solo datos, queda en el 8081)
#
# La base nace VACÍA con el administrador inicial de tu .env. La web viene compilada para hablar con
# http://localhost:8081, así que funciona en el mismo equipo donde corre Docker.
# =============================================================================
name: gesacad

services:
  db:
    image: ${DOCKERHUB_USUARIO:-dejota0712}/gesacad-db:${GESACAD_VERSION:-1.0}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-bdgesacad}
      MYSQL_USER: ${DB_USER:?Define DB_USER en .env}
      MYSQL_PASSWORD: ${DB_PASS:?Define DB_PASS en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3307}:3306"
    volumes:
      - gesacad_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    image: ${DOCKERHUB_USUARIO:-dejota0712}/gesacad-backend:${GESACAD_VERSION:-1.0}
    init: true
    restart: unless-stopped
    environment:
      PORT: 8081
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-bdgesacad}
      DB_USER: ${DB_USER:?Define DB_USER en .env}
      DB_PASS: ${DB_PASS:?Define DB_PASS en .env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (aleatorio, mínimo 16 caracteres)}
      APP_URL: ${APP_URL:-http://localhost:5000}
      AUTH_MODE: ${AUTH_MODE:-enforce}
      ALLOW_LEGACY_LOGIN: ${ALLOW_LEGACY_LOGIN:-false}
      ADMIN_BOOTSTRAP_USER: ${ADMIN_BOOTSTRAP_USER:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - gesacad_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8081/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    image: ${DOCKERHUB_USUARIO:-dejota0712}/gesacad-web:${GESACAD_VERSION:-1.0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  gesacad_mysql:
  gesacad_uploads:
