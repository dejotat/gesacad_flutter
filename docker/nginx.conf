server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión de los archivos de texto (el JavaScript de Flutter pesa varios MB)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;

    include /etc/nginx/conf.d/security-headers.inc;

    # El "service worker" y el arranque NO se guardan en caché: así una versión nueva
    # de la aplicación se ve al recargar, no días después.
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
    }
    location = /flutter_service_worker.js {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
    }
    location = /flutter_bootstrap.js {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
    }
    location = /version.json {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
    }

    # Recursos pesados y estables (fuentes, íconos, motor): una semana en caché
    location ~* \.(?:ttf|otf|woff2?|png|jpg|jpeg|gif|ico|svg|wasm)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Aplicación de una sola página: cualquier ruta devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
