name: gesacad
description: >
  GESACAD - Sistema de Gestión Académica Universitaria
  Corporación Universitaria Unicomfacauca
  Implementa CU-01 a CU-07 del IEEE 830.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # HTTP para llamadas REST al backend Node.js (RF01–RF15)
  http: ^1.2.0

  # Persistencia de sesión local (RF01–RF02 — redirección por rol)
  shared_preferences: ^2.3.2

  # Selección de archivos para entrega de tareas (CU-05)
  file_picker: ^8.0.0

  # Gráficas del dashboard de estadísticas — 100% libre, sin licencias (CU-06/RF05)
  fl_chart: ^0.68.0

  # Formateo de fechas para actividades (RF06, RF07)
  intl: ^0.19.0

  # Tipografía institucional (Poppins, Nunito)
  google_fonts: ^6.2.1

  # Calendario académico interactivo (CU-09: calendario)
  table_calendar: ^3.1.0

  url_launcher: ^6.3.2
  flutter_tts: ^4.2.5
  image_picker: ^1.2.2

  # TalkBack usa la Web Speech API nativa del navegador (sin paquete externo)

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

# Configuración del ícono de la app para todas las plataformas
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/

dependency_overrides:
  path_provider_foundation: ^2.3.2
  # Fijar objective_c a 9.3.0 para evitar el bug del build hook
  # con rutas que contienen espacios (C:\Users\JORGE TECHNOLOGY\flutter)
  objective_c: 9.3.0